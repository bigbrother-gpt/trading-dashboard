<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e1a"><title>Trading Intelligence · Daily Dashboard</title>
<style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,Arial;background:#080e1a;color:#e8effa}*{box-sizing:border-box}body{margin:0}header{background:#101a2b;border-bottom:1px solid #29364b;padding:12px max(16px,calc((100vw - 1500px)/2));display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:16px;margin:0;font-weight:700}.tag{font-size:11px;color:#a4b4cb;background:#1d2b42;padding:5px 9px;border-radius:20px}.grow{flex:1}.date{font-size:13px;color:#b9cbe4}button{background:#233858;border:1px solid #395477;border-radius:9px;color:#edf5ff;padding:9px 12px;cursor:pointer}button:hover{background:#30507c}#status{padding:7px 16px;font-size:12px;color:#a8bad1;background:#0b1423;border-bottom:1px solid #29364b}#status.warn{color:#ffcc81}iframe{display:block;border:0;width:100%;height:calc(100vh - 103px);min-height:620px}@media(max-width:650px){header{gap:8px;padding:10px 12px}iframe{height:calc(100dvh - 130px)}h1{width:100%}}</style></head>
<body><header><h1>◈ Trading Intelligence</h1><span class="tag">DAILY SNAPSHOT · NO LIVE CHARTS</span><div class="grow"></div><span class="date" id="date">Checking published dashboard…</span><button id="refresh">Check update</button></header><div id="status" role="status" aria-live="polite">Loading latest published snapshot…</div><iframe id="dashboard" title="Daily market intelligence dashboard" loading="eager"></iframe>
<script>
const manifest='data/latest.json';const frame=document.getElementById('dashboard');const dateEl=document.getElementById('date');const statusEl=document.getElementById('status');let current='';let busy=false;
function valid(data){
  return data &&
    /^\d{4}-\d{2}-\d{2}$/.test(data.date) &&
    /^archive\/trading_dashboard(?:_\d{4}-\d{2}-\d{2})?\.html$/.test(data.file);
}
async function check(){if(busy)return;busy=true;try{const r=await fetch(manifest+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('manifest HTTP '+r.status);const d=await r.json();if(!valid(d))throw Error('invalid published manifest');dateEl.textContent='Published brief: '+d.date;const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const old=d.date<today;statusEl.classList.toggle('warn',old);const msg=old?'Previous published snapshot — no newer brief has been published yet.':'Latest published snapshot.';statusEl.textContent=msg+' This is fixed reference data, not live prices. Last checked '+new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit'}).format(new Date())+' Lisbon.';if(current!==d.file){current=d.file;frame.src=d.file+'?published='+encodeURIComponent(d.published_at||d.date);}}catch(e){statusEl.classList.add('warn');statusEl.textContent='Cannot check for updates ('+e.message+'). Existing dashboard remains available if already loaded.';}finally{busy=false}}
document.getElementById('refresh').addEventListener('click',check);check();setInterval(check,5*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
</script></body></html>
