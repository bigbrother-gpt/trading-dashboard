name: Publish daily trading dashboard
on:
  schedule:
    # Lisbon midnight: 00:00 UTC in winter, 23:00 UTC previous day in summer.
    - cron: '0 0,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-trading-dashboard
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Lisbon midnight (manual runs always allowed)
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          local = datetime.now(ZoneInfo('Europe/Lisbon'))
          allowed = os.environ['EVENT_NAME'] == 'workflow_dispatch' or local.hour == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(allowed).lower()}\n')
          print(f'Lisbon time: {local.isoformat()}, run={allowed}')
          PY
      - name: Generate dated snapshot
        if: steps.clock.outputs.run == 'true'
        run: python scripts/update_dashboard.py
      - name: Commit archive and manifest
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/ data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish trading snapshot $(TZ=Europe/Lisbon date +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.clock.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.clock.outputs.run == 'true'
        with:
          path: '.'
      - name: Deploy GitHub Pages
        if: steps.clock.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
