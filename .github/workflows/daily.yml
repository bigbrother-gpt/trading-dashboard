name: Publish daily trading dashboard

on:
  schedule:
    # Daily at Lisbon local midnight; GitHub may start scheduled runs late.
    - cron: '0 0 * * *'
      timezone: 'Europe/Lisbon'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-trading-dashboard
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate current Lisbon snapshot
        run: python scripts/update_dashboard.py
      - name: Validate output
        run: |
          test -s archive/trading_dashboard.html
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          with open('data/latest.json', encoding='utf-8') as f:
              data = json.load(f)
          today = datetime.now(ZoneInfo('Europe/Lisbon')).date().isoformat()
          assert data['date'] == today, (data['date'], today)
          assert data['file'] == 'archive/trading_dashboard.html'
          assert data['published_at']
          print('Validated:', data)
          PY
      - name: Commit dashboard and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/trading_dashboard.html data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily trading dashboard"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
